name: Arak Kala validation
on:
  push:
    branches: [main, 'stabilization/**', 'design/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARAK_DEVELOPMENT: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q config store
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test store --verbosity 2
      - run: python manage.py collectstatic --noinput
      - run: node --check store/static/storefront/app.js
      - run: node --check store/static/storefront/pages.js
      - run: node --check store/static/store/main.js
  android-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-admin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arak-kala-admin-debug
          path: android-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --requirement backend/requirements.txt
      - name: Verify deployment settings
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          export ARAK_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export ARAK_ALLOWED_HOSTS=shop.example.invalid
          python manage.py check --deploy --fail-level ERROR
      - name: Install checksum-verified Gitleaks
        run: |
          curl -fLsS --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan complete reachable Arak Kala Git history
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git rev-list --all > "$work/revisions"
          echo "Reachable commits: $(wc -l < "$work/revisions")"
          failed=0
          while IFS= read -r rev; do
            mkdir "$work/snapshot"
            git archive "$rev" -- . ':(exclude)archives/sepas' | tar -xf - -C "$work/snapshot"
            echo "Scanning revision $rev (separate Sepas archive excluded)"
            rm -f "$work/findings.json"
            scan_status=0
            /tmp/gitleaks dir --redact=100 --no-banner --max-archive-depth 2 --max-target-megabytes 30 --report-format json --report-path "$work/findings.json" "$work/snapshot" || scan_status=$?
            if [ "$scan_status" -eq 1 ]; then
              python scripts/triage_history_findings.py "$work/snapshot" "$work/findings.json" || failed=1
            elif [ "$scan_status" -ne 0 ]; then
              echo "Scanner error: $scan_status"
              failed=1
            fi
            rm -rf "$work/snapshot"
          done < "$work/revisions"
          exit "$failed"
  browser-storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARAK_DEVELOPMENT: '1'
      ARAK_DB_PATH: /tmp/arak-browser-test.sqlite3
      ARAK_MEDIA_ROOT: /tmp/arak-browser-media
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py migrate --noinput
      - run: python ../scripts/test_storefront_browser.py
      - run: python ../scripts/test_manager_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-preview
          path: backend/browser-artifacts/
          if-no-files-found: warn
  deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backup and safe restore test
        run: python backend/ops/test_backup.py
      - name: Isolated container deployment over local TLS
        working-directory: deploy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            echo ARAK_SITE_ADDRESS=localhost
            echo ARAK_ALLOWED_HOSTS=localhost
            printf 'ARAK_SECRET_KEY=%s\n' "$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
            echo ARAK_MAIL_ENABLED=0
          } > .env
          export ARAK_HTTP_PORT=8080 ARAK_HTTPS_PORT=8443
          docker compose config --quiet
          docker compose build app
          docker compose run --rm app python manage.py migrate --noinput
          docker compose run --rm app python manage.py collectstatic --noinput
          docker compose up -d --wait
          # Trust the fixture CA rather than disabling TLS validation.
          docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt /tmp/arak-test-ca.crt
          curl --cacert /tmp/arak-test-ca.crt -fSs --retry 10 --retry-all-errors https://localhost:8443/api/ready
          curl --cacert /tmp/arak-test-ca.crt -fSs https://localhost:8443/ -o /tmp/arak-home.html
          grep -q 'ARAK' /tmp/arak-home.html
          curl --cacert /tmp/arak-test-ca.crt -fSs https://localhost:8443/static/storefront/pages.css -o /tmp/arak-pages.css
          test -s /tmp/arak-pages.css
          test "$(curl --cacert /tmp/arak-test-ca.crt -sS -o /dev/null -w '%{http_code}' https://localhost:8443/uploads/private.sqlite3)" = 404
          docker compose exec -T app python manage.py shell -c 'from store.models import Product; Product.objects.create(sku="RELEASE-RACE-FIXTURE", name="Release acceptance fixture", price=1000, stock=1)'
          python ../scripts/test_release_acceptance.py
          # Fixture-only full project backup: actual deployed DB, media and tracked source.
          sudo mkdir -p /tmp/arak-ci-backups
          sudo chmod 700 /tmp/arak-ci-backups
          sudo env ARAK_HTTP_PORT=8080 ARAK_HTTPS_PORT=8443 bash ./backup-daily.sh /tmp/arak-ci-backups
          test "$(sudo find /tmp/arak-ci-backups -name '*.complete' | wc -l)" = 1
          sudo find /tmp/arak-ci-backups -name SHA256SUMS -execdir sha256sum -c SHA256SUMS \;
          curl --cacert /tmp/arak-test-ca.crt -fSs --retry 10 --retry-all-errors https://localhost:8443/api/ready
      - name: Tear down isolated CI containers
        if: always()
        working-directory: deploy
        run: docker compose down -v
