{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="صفحه‌های نتیجه">
  {% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}">قبلی</a>{% endif %}
  <span>صفحهٔ {{ page.number }} از {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">بعدی</a>{% endif %}
</nav>
{% endif %}
