{% load store_media %}<article class="product-card"><a class="product-photo" href="{% url 'public_product' product.pk %}" aria-label="نمایش {{ product.name }}">{% if product.images %}<img src="{{ product.images.0|media_url }}" alt="{{ product.name }}" loading="lazy" decoding="async">{% else %}<span class="product-placeholder" aria-hidden="true">AK</span>{% endif %}<span class="stock-tag{% if not product.stock %} unavailable{% endif %}">{% if product.stock %}موجود{% else %}ناموجود{% endif %}</span><span class="product-arrow" aria-hidden="true">↖</span></a><div class="product-meta"><span class="product-category">{{ product.category|default:'محصولات' }}</span><a class="product-name" href="{% url 'public_product' product.pk %}">{{ product.name }}</a><div class="product-price">{% if product.discount_price != None %}<del>{{ product.price }} ریال</del>{% endif %}<strong>{{ product.actual_price }} ریال</strong></div></div></article>
