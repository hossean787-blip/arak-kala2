name: arak-kala
services:
  app:
    build:
      context: ../backend
    env_file: .env
    environment:
      ARAK_DEVELOPMENT: "0"
      ARAK_DB_PATH: /data/store.sqlite3
      ARAK_MEDIA_ROOT: /media
      ARAK_TRUST_LOCAL_PROXY: "1"
      ARAK_TRUST_REAL_IP: "1"
    volumes:
      - database:/data
      - media:/media
      - static:/app/staticfiles
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/ready',headers={'Host':os.environ['ARAK_ALLOWED_HOSTS'].split(',')[0].strip(),'X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(r,timeout=3).status==200"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      ARAK_SITE_ADDRESS: ${ARAK_SITE_ADDRESS:?Set the verified domain}
    ports:
      - "${ARAK_HTTP_PORT:-80}:80"
      - "${ARAK_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  media:
  static:
  caddy_data:
  caddy_config:
